# Render Blueprint for the Verity API (FastAPI + in-process provider/verifier/finalizer/indexer workers).
# Render -> New -> Blueprint -> this repo. Step-by-step guide: DEPLOY.md.
# Values marked `sync: false` are prompted for on first deploy; set them to the PRODUCTION Supabase project.
services:
  - type: web
    name: verity-api
    runtime: docker
    plan: free
    region: singapore        # nearest Render region to the Supabase project (ap-northeast-2)
    # backend/Dockerfile runs one uvicorn worker on $PORT. It builds from the repo root (Render's
    # default context); the root .dockerignore limits the context to the backend files.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    buildFilter:
      paths: ["backend/**"]   # frontend-only commits don't redeploy the API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # --- Solana (same devnet program as local; see programs/verity_core/DEPLOYMENT.md)
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com   # a Helius devnet URL rate-limits far less
      - key: PROGRAM_ID
        value: ByADChPce9hwCuSak9hFwiiCyndYGj7dkYypm4XYEJL1
      - key: ZK_PROGRAM_ID
        value: A5taiN69gN4EALtyM9X9S7dVMbhA5qo8aejHrfo48mVv
      - key: CLUSTER
        value: devnet
      - key: PROVIDER_KEYPAIR_JSON        # JSON array of 64 bytes, or base64 of the 64 bytes
        sync: false
      - key: VERIFIER_KEYPAIRS_JSON       # JSON array of 3 keypairs
        sync: false
      - key: ADMIN_KEYPAIR_JSON           # config authority (falls back to provider)
        sync: false
      - key: REQUESTER_KEYPAIR_JSON       # optional: funds /admin simulation-lab requests
        sync: false
      # --- Supabase: the PRODUCTION project (not the one in backend/.env)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET          # legacy HS256 secret; JWKS (new signing keys) is used as a fallback
        sync: false
      # --- Pinata / IPFS (optional)
      - key: PINATA_JWT
        sync: false
      - key: PINATA_GATEWAY
        sync: false
      # --- App
      - key: FRONTEND_ORIGIN              # comma-separated, e.g. https://verity.vercel.app
        sync: false
      - key: FRONTEND_ORIGIN_REGEX        # Vercel preview URLs, e.g. https://verity[a-z0-9-]*\.vercel\.app
        sync: false
      - key: ADMIN_EMAILS
        value: support@arhamfintech.ai
      - key: WORKERS_ENABLED
        value: "true"
      # --- AI explainer (optional)
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
