[package]
name = "verity_core"
version = "0.1.0"
description = "Verity: verifiable computation receipts, attestations and disputes on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verity_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "allow" }
