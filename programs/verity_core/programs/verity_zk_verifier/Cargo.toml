[package]
name = "verity_zk_verifier"
version = "0.1.0"
description = "Verity: on-chain Groth16 verification of the payroll rule set, bound to verity_core requests and receipts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verity_zk_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "verity_core/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
solana-bn254 = "2.2"
solana-sha256-hasher = "2.3"
verity_core = { path = "../verity_core", features = ["cpi"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "allow" }
